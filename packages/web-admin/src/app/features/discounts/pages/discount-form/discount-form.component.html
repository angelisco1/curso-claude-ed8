<div class="fade-in">
  <div class="page-header">
    <div class="header-back">
      <a [routerLink]="listUrl" class="back-link">
        <lucide-icon name="chevron-left" [size]="18"></lucide-icon>
      </a>
      <h1>{{ pageTitle }}</h1>
    </div>
  </div>

  @if (error()) {
    <div class="alert-error">{{ error() }}</div>
  }

  <form (ngSubmit)="onSubmit()" class="card form-card">
    <div class="form-grid">
      <div class="form-group">
        <label for="code">Código</label>
        <input id="code" type="text" class="form-control" [(ngModel)]="form.code" name="code" required placeholder="VERANO10" />
      </div>

      <div class="form-group">
        <label for="type">Tipo</label>
        <select id="type" class="form-control" [(ngModel)]="form.type" name="type">
          <option value="fixed">Importe fijo (€)</option>
          <option value="percent">Porcentaje (%)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="value">Valor {{ form.type === 'percent' ? '(% hasta 100)' : '(€)' }}</label>
        <input id="value" type="number" class="form-control" [(ngModel)]="form.value" name="value" required min="0.01" step="0.01" [attr.max]="form.type === 'percent' ? 100 : null" />
      </div>

      <div class="form-group">
        <label for="minOrder">Pedido mínimo (€)</label>
        <input id="minOrder" type="number" class="form-control" [(ngModel)]="minOrder" name="minOrder" min="0" step="0.01" placeholder="Sin mínimo" />
      </div>

      <div class="form-group">
        <label for="validFrom">Válido desde</label>
        <input id="validFrom" type="date" class="form-control" [(ngModel)]="validFrom" name="validFrom" />
      </div>

      <div class="form-group">
        <label for="validUntil">Válido hasta</label>
        <input id="validUntil" type="date" class="form-control" [(ngModel)]="validUntil" name="validUntil" />
      </div>

      <div class="form-group">
        <label for="maxUses">Usos máximos</label>
        <input id="maxUses" type="number" class="form-control" [(ngModel)]="maxUses" name="maxUses" min="1" step="1" placeholder="Sin límite" />
      </div>

      <div class="form-group checkbox-group">
        <input id="active" type="checkbox" [(ngModel)]="form.active" name="active" />
        <label for="active">Activo</label>
      </div>
    </div>

    <div class="form-actions">
      <a [routerLink]="listUrl" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        @if (loading()) {
          Guardando...
        } @else {
          Guardar
        }
      </button>
    </div>
  </form>
</div>
